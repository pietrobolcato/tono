name: Play Tono on Pages
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tono-pages
  cancel-in-progress: false

jobs:
  site:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: main
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: joakimeriksson/fm1-emu
          ref: 736aded65c8e2e9d652cf595fca248734483a877
          path: emulator
          persist-credentials: false
      - name: Build the browser emulator
        working-directory: emulator
        env:
          RUSTFLAGS: -Cllvm-args=-inline-threshold=2000 -Clink-arg=--export-table -Clink-arg=--growable-table
          CARGO_PROFILE_RELEASE_CODEGEN_UNITS: 1
        run: |
          rustup toolchain install 1.100.0 --profile minimal --target wasm32-unknown-unknown
          cargo +1.100.0 build --locked --release -p fm1-web --target wasm32-unknown-unknown
      - name: Stage the stable firmware and notices
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          mkdir site
          tag=$(gh release view --json tagName --jq .tagName)
          version=${tag#v}
          gh release download "$tag" --dir site --pattern "tono-$version.fwsc" --pattern "tono-$version-notices.zip" --pattern SHA256SUMS
          python3 web/tono/stage.py emulator emulator/target/wasm32-unknown-unknown/release/fm1_web.wasm site "$version"
          mkdir -p site/listen
          cp docs/tono/media/{index.html,meet-tono.jpg,meet-tono.mp4,piano-and-cello.mp3} site/listen/
          cd site
          awk -v fw="tono-$version.fwsc" -v notices="tono-$version-notices.zip" '$2==fw || $2==notices' SHA256SUMS | sha256sum --check
          rm SHA256SUMS
          mv "tono-$version.fwsc" tono.fwsc
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site
  deploy:
    needs: site
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    steps:
      - name: Publish Tono player
        id: publish
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
