name: Bug report
description: Report a reproducible problem in Tono
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Describe one bug per issue. Keep whole-flash backups and private recordings on your computer.
  - type: input
    id: version
    attributes:
      label: Tono version
      description: Use the version shown on the startup screen
      placeholder: "v0.65-opt"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Computer, OS and browser (if the editor, installer or USB is involved)
      placeholder: "macOS 15.6, Chrome 140"
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What happened
      description: A photo or short video helps.
    validations:
      required: true
