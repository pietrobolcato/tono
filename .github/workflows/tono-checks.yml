name: Tono checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  host:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Run host checks without the device toolchain
        run: |
          set -eu
          for test in amb_pcm_octets_test amb_controls_test amb_policy_test amb_music_test; do
            clang -std=c11 -O2 -Wall -Wextra -Werror "tests/$test.c" -o "/tmp/$test"
            "/tmp/$test"
          done
